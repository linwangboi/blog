{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Django Blogs</title>
    <link
      href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900"
      rel="stylesheet"
    />
    <link href="{% static 'css/blog.css' %}" rel="stylesheet" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: #f9f9f9;
      }

      .main-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 0;
      }

      .error-container {
        text-align: center;
        max-width: 600px;
        margin: 0 auto;
        padding: 3rem 2rem;
      }

      .error-code {
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: 8rem;
        font-weight: 900;
        color: #ffc107;
        line-height: 1;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      .error-title {
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: 2.5rem;
        color: #212529;
        margin-bottom: 1rem;
        font-weight: 700;
      }

      .error-message {
        font-size: 1.1rem;
        color: #727272;
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .error-divider {
        width: 80px;
        height: 3px;
        background: linear-gradient(
          to right,
          transparent,
          #ffc107,
          transparent
        );
        margin: 2rem auto;
      }

      .action-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn-custom {
        font-family: "Playfair Display", Georgia, "Times New Roman", serif;
        font-size: 1rem;
        padding: 0.75rem 2rem;
        font-weight: 700;
        transition: all 0.3s ease;
        text-decoration: none;
        border-radius: 4px;
      }

      .btn-home {
        background-color: #ffc107;
        color: #212529;
        border: 2px solid #ffc107;
      }

      .btn-home:hover {
        background-color: #212529;
        color: #ffc107;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        text-decoration: none;
      }

      .btn-back {
        background-color: transparent;
        color: #212529;
        border: 2px solid #212529;
      }

      .btn-back:hover {
        background-color: #212529;
        color: #fff;
        transform: translateY(-2px);
        text-decoration: none;
      }

      .decorative-icons {
        font-size: 3rem;
        margin: 2rem 0;
        opacity: 0.2;
      }

      .blog-footer {
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <div class="col-8 pt-1">
            <a class="blog-header-logo text-dark" href="/">Django Blog</a>
          </div>
          <div class="col-4 d-flex justify-content-end align-items-center">
            <a class="btn btn-sm btn-warning" href="#">Login</a> &nbsp;
            <a class="btn btn-sm btn-outline-secondary" href="#">Register</a>
          </div>
        </div>
      </header>

      <div class="main-content">
        <div class="error-container">
          <div class="decorative-icons">📖 ✨</div>
          <div class="error-code">404</div>
          <h1 class="error-title">Page Not Found</h1>
          <div class="error-divider"></div>
          <p class="error-message">
            Oops! It seems the page you're looking for has wandered off like a
            lost chapter in a book. Don't worry, let's get you back on track.
          </p>
          <div class="action-buttons">
            <a href="/" class="btn btn-custom btn-home">Return Home</a>
            <a href="javascript:history.back()" class="btn btn-custom btn-back"
              >Go Back</a
            >
          </div>
        </div>
      </div>
    </div>

    <footer class="blog-footer">
      <p>Django blog</p>
    </footer>
  </body>
</html>
