{% extends 'base.html' %}


{% block content %}
<div class="row">
    {% include 'dashboard/sidebar.html' %}

    <div class="col-md-9">
        <h3 class="mb-3">Add New Post</h3>
        {% load crispy_forms_tags %}
        <form action="{% url 'add_post' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
    </div>
            
</div>
    
{% endblock content %}
