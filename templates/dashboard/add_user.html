{% extends 'base.html' %}


{% block content %}
<div class="row">
    {% include 'dashboard/sidebar.html' %}

    <div class="col-md-9">
        
        {% if perms.auth.view_user %}
        <h3 class="mb-3">Add New User</h3>
        {% load crispy_forms_tags %}
        <form action="{% url 'add_user' %}" method="POST" style="width: 500px;">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>            
        {% else %}
        <h5>You do not have permission to view this page.</h5>            
        {% endif %}
    </div>
</div>
    
{% endblock content %}
